<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Prompt Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            color: #d1d5db;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
        }

        .price {
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .notice {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            font-size: 14px;
            color: #4b5563;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <h1>My Prompt Assistant</h1>
    <p>Send your request and get professional assistance.</p>
</header>

<main>

    <label for="prompt">What would you like help with?</label>

    <textarea
        id="prompt"
        placeholder="Write your prompt here...">
    </textarea>

    <div class="price">
        Service price: KSh 100
    </div>

    <button onclick="submitPrompt()">
        PAY & SEND PROMPT
    </button>

    <div class="notice">
        Your request will be processed after payment confirmation.
        Payments will be handled through an official payment integration.
    </div>

</main>

<footer>
    © 2026 My Prompt Assistant
</footer>

<script>
    function submitPrompt() {

        const prompt = document.getElementById("prompt").value.trim();

        if (prompt === "") {
            alert("Please enter your prompt first.");
            return;
        }

        alert("Your prompt has been received. Payment integration will be added next.");
    }
</script>

</body>
</html>
